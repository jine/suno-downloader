version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - STORAGE_TYPE=local
      - STORAGE_PATH=/app/storage
      - LINK_EXPIRY_HOURS=24
      - MAX_FILE_AGE_HOURS=48
      - CLEANUP_INTERVAL_MINUTES=60
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  backend_storage:
